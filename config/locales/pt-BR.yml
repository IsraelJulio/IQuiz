pt-BR:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d de %B de %Y"
    day_names:
      - Domingo
      - Segunda-feira
      - Terça-feira
      - Quarta-feira
      - Quinta-feira
      - Sexta-feira
      - Sábado
    abbr_day_names:
      - Dom
      - Seg
      - Ter
      - Qua
      - Qui
      - Sex
      - Sáb
    month_names:
      - ~
      - Janeiro
      - Fevereiro
      - Março
      - Abril
      - Maio
      - Junho
      - Julho
      - Agosto
      - Setembro
      - Outubro
      - Novembro
      - Dezembro
    abbr_month_names:
      - ~
      - Jan
      - Fev
      - Mar
      - Abr
      - Mai
      - Jun
      - Jul
      - Ago
      - Set
      - Out
      - Nov
      - Dez
    order:
      - :day
      - :month
      - :year

  time:
    formats:
      default: "%d/%m/%Y %H:%M:%S"
      short: "%d/%m %H:%M"
      long: "%d de %B de %Y às %H:%M"
    am: ""
    pm: ""

  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2
    currency:
      format:
        format: "%u %n"
        unit: "R$"
        separator: ","
        delimiter: "."
        precision: 2

  activerecord:
    errors:
      messages:
        blank: "não pode ficar em branco"
        taken: "já está em uso"
        too_short: "é muito curto (mínimo %{count} caracteres)"
        too_long: "é muito longo (máximo %{count} caracteres)"
        invalid: "é inválido"
        not_a_number: "não é um número"
        greater_than: "deve ser maior que %{count}"
        less_than_or_equal_to: "deve ser menor ou igual a %{count}"
        inclusion: "não está incluído na lista"
